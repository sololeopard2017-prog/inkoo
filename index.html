<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تتو زنده روی بدن · INKOO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D0D0D;--card:#181818;--text:#F5F5F0;--mute:#A3A3A3;--red:#E50914}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  header{flex:none;padding:8px 16px;font-weight:700;border-bottom:1px solid #222}
  header span{color:var(--red)}
  #stageWrap{flex:none;height:62vh;height:62dvh;display:flex;align-items:center;justify-content:center;padding:6px;background:#000;border-bottom:1px solid #222;position:relative}
  canvas#cv{display:block;max-width:100%;max-height:100%;border-radius:10px;background:#111;touch-action:none}
  canvas#cv.mirror{transform:scaleX(-1)}
  #status{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:13px;color:var(--text);background:rgba(0,0,0,.65);border-radius:8px;padding:6px 10px;pointer-events:none}
  #hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:24px;font-size:14px;line-height:2;pointer-events:none}
  .panel{background:var(--card);flex:1;min-height:0;overflow-y:auto;padding:12px 16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .btn{flex:1;min-width:110px;background:#222;color:var(--text);border:1px solid #333;border-radius:10px;min-height:44px;padding:11px 8px;font:inherit;font-size:13px;text-align:center;cursor:pointer}
  .btn.primary{background:var(--red);border-color:var(--red);font-weight:700}
  .btn.on{border-color:var(--red)}
  .btn:disabled{opacity:.4}
  label.ctl{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
  input[type=range]{height:36px;width:100%;accent-color:var(--red)}
  input[type=file]{display:none}
  .note{font-size:12px;color:var(--mute);margin:0 0 12px;line-height:1.8}
  #toast{position:fixed;left:12px;right:12px;bottom:16px;background:#222;border:1px solid var(--red);color:var(--text);padding:12px;border-radius:10px;font-size:13px;text-align:center;display:none;z-index:80}
  #cropOv{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
  #cropCv{touch-action:none;border-radius:6px;background:#222}
  #cropOv .row{width:100%;max-width:420px;margin:0}
</style>
</head>
<body>
<header>INK<span>OO</span> · تتو زنده روی بدن</header>

<div id="stageWrap">
  <canvas id="cv" width="640" height="480"></canvas>
  <div id="hint">اول طرح تتو را انتخاب کن، بعد «شروع دوربین» را بزن.</div>
  <div id="status" style="display:none"></div>
</div>

<div class="panel">
  <div class="row">
    <label class="btn" for="tattooIn">۱. طرح تتو</label>
    <button class="btn primary" id="startBtn">۲. شروع دوربین</button>
    <input id="tattooIn" type="file" accept="image/*">
  </div>
  <div class="row">
    <button class="btn" id="cropBtn" disabled>برش طرح</button>
    <button class="btn" id="blackBtn">جوهر مشکی</button>
  </div>
  <label class="ctl">غلظت جوهر<input id="sOp" type="range" min="20" max="100" value="85"></label>
  <div class="row">
    <button class="btn" id="camBtn" disabled>تعویض دوربین</button>
    <button class="btn primary" id="snapBtn" disabled>ثبت عکس</button>
  </div>
  <div class="note">طرح وسط تصویر است. با یک انگشت جابه‌جایش کن؛ با دو انگشت بزرگ و کوچک و بچرخانش. طرح فقط روی پوست دیده می‌شود و دور عضو می‌پیچد؛ برای بهتر شدن، عضو را وسط کادر و در نور خوب بگیر. تصویر دوربین جایی ارسال نمی‌شود.</div>
</div>

<div id="cropOv">
  <canvas id="cropCv"></canvas>
  <div class="row">
    <button class="btn primary" id="cropOk">تایید برش</button>
    <button class="btn" id="cropFull">کل تصویر</button>
    <button class="btn" id="cropCancel">لغو</button>
  </div>
</div>
<div id="toast"></div>

<script type="module">
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', {willReadFrequently:true});
const hint = $('hint'), statusEl = $('status');
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.setAttribute('playsinline', '');

let stream = null, facing = 'environment', running = false, mirror = false;
let origSrc = null, tattooSrc = null, ink = null, blackInk = false;
let opV = 0.85, skinL = 0.6, frame = 0;
let tx = null, ty = null, sc = 1, rot = 0, lastW = 0, lastH = 0;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 4500);
}
let lastStatus = '';
function setStatus(msg){
  if(msg === lastStatus) return;
  lastStatus = msg;
  if(!msg){ statusEl.style.display = 'none'; return; }
  statusEl.textContent = msg; statusEl.style.display = 'block';
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

// ---------- ساخت جوهر از طرح ----------
// حالت رنگی: رنگ‌های اصلی حفظ می‌شود و فقط زمینه‌ی سفید حذف می‌شود.
// حالت مشکی: طرح سیاه‌وسفید و شبیه جوهر تتو می‌شود.
function buildInk(){
  if(!tattooSrc) return;
  const k = Math.min(1, 900 / Math.max(tattooSrc.width, tattooSrc.height));
  const w = Math.max(1, Math.round(tattooSrc.width*k)), h = Math.max(1, Math.round(tattooSrc.height*k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'); cx.drawImage(tattooSrc, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h), p = d.data;

  // آیا خود فایل زمینه‌ی شفاف دارد؟
  let tr = 0, tot = 0;
  for(let i = 3; i < p.length; i += 16){ tot++; if(p[i] < 250) tr++; }
  const hasAlpha = tr/Math.max(1, tot) > 0.02;

  // روشنایی کاغذ از لبه‌ی تصویر حدس زده می‌شود
  const hist = new Array(256).fill(0); let cnt = 0;
  const bw = Math.max(2, Math.round(Math.min(w, h)*0.03));
  for(let y = 0; y < h; y++){
    const edgeRow = y < bw || y >= h-bw;
    for(let x = 0; x < w; x++){
      if(!edgeRow && x >= bw && x < w-bw){ x = w-bw-1; continue; }
      const q = (y*w + x)*4;
      if(p[q+3] > 200){ hist[Math.round(0.299*p[q] + 0.587*p[q+1] + 0.114*p[q+2])]++; cnt++; }
    }
  }
  let bg = 255;
  if(cnt > 20){ let acc = 0; for(let m = 0; m < 256; m++){ acc += hist[m]; if(acc >= cnt/2){ bg = m; break; } } if(bg < 140) bg = 255; }
  const cut = 0.12;

  if(blackInk){
    const col = [26, 30, 38];
    for(let i = 0; i < p.length; i += 4){
      const lum = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
      const dk = clamp((bg - lum)/bg, 0, 1);
      const dark = Math.pow(clamp((dk - cut)/(1 - cut), 0, 1), 0.85);
      p[i] = col[0]; p[i+1] = col[1]; p[i+2] = col[2];
      p[i+3] = Math.round(p[i+3] * dark);
    }
  } else if(!hasAlpha){
    for(let i = 0; i < p.length; i += 4){
      const m = Math.min(p[i], p[i+1], p[i+2]);
      const dk = clamp((bg - m)/bg, 0, 1);
      const a = Math.pow(clamp((dk - cut)/(1 - cut), 0, 1), 0.85);
      p[i+3] = Math.round(p[i+3] * a);
    }
  }
  cx.putImageData(d, 0, 0);
  ink = c;
}

// ---------- ورودی طرح ----------
$('tattooIn').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    URL.revokeObjectURL(u);
    origSrc = img; tattooSrc = img; buildInk();
    tx = null; sc = 1; rot = 0;
    $('cropBtn').disabled = false;
    toast('طرح آماده شد.');
    if(!running) hint.textContent = 'حالا «شروع دوربین» را بزن.';
  };
  img.onerror = () => { URL.revokeObjectURL(u); toast('این فایل باز نشد. یک عکس JPG یا PNG انتخاب کن.'); };
  img.src = u;
});
$('sOp').oninput = e => { opV = +e.target.value / 100; };
$('blackBtn').onclick = e => { blackInk = !blackInk; e.currentTarget.classList.toggle('on', blackInk); buildInk(); };

// ---------- برش طرح ----------
const cropOv = $('cropOv'), cropCv = $('cropCv'), cctx = cropCv.getContext('2d');
let cr = null, cds = 1, cmode = null, cstart = null;
const MINC = 30;
function cropDraw(){
  const W = cropCv.width, H = cropCv.height;
  cctx.clearRect(0, 0, W, H);
  cctx.drawImage(origSrc, 0, 0, W, H);
  const x = cr.x*cds, y = cr.y*cds, w = cr.w*cds, h = cr.h*cds;
  cctx.fillStyle = 'rgba(0,0,0,.6)';
  cctx.fillRect(0, 0, W, y); cctx.fillRect(0, y+h, W, H-y-h);
  cctx.fillRect(0, y, x, h); cctx.fillRect(x+w, y, W-x-w, h);
  cctx.strokeStyle = '#E50914'; cctx.lineWidth = 2; cctx.strokeRect(x, y, w, h);
  cctx.fillStyle = '#E50914';
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(q => { cctx.beginPath(); cctx.arc(q[0], q[1], 11, 0, 6.283); cctx.fill(); });
}
function openCrop(){
  if(!origSrc) return;
  const maxW = window.innerWidth - 24, maxH = window.innerHeight - 140;
  cds = Math.min(maxW / origSrc.width, maxH / origSrc.height);
  cropCv.width = Math.round(origSrc.width*cds); cropCv.height = Math.round(origSrc.height*cds);
  cropCv.style.width = cropCv.width + 'px'; cropCv.style.height = cropCv.height + 'px';
  cr = {x: 0, y: 0, w: origSrc.width, h: origSrc.height};
  cropOv.style.display = 'flex';
  cropDraw();
}
function cropPos(e){
  const r = cropCv.getBoundingClientRect();
  return {x: (e.clientX - r.left) / cds, y: (e.clientY - r.top) / cds};
}
cropCv.addEventListener('pointerdown', e => {
  const p = cropPos(e), tol = 30 / cds;
  const cs = {tl:[cr.x, cr.y], tr:[cr.x+cr.w, cr.y], bl:[cr.x, cr.y+cr.h], br:[cr.x+cr.w, cr.y+cr.h]};
  cmode = null;
  for(const k in cs){ if(Math.hypot(p.x - cs[k][0], p.y - cs[k][1]) < tol){ cmode = k; break; } }
  if(!cmode && p.x > cr.x && p.x < cr.x+cr.w && p.y > cr.y && p.y < cr.y+cr.h) cmode = 'move';
  if(!cmode) return;
  cstart = {p, r: {...cr}};
  cropCv.setPointerCapture(e.pointerId);
});
cropCv.addEventListener('pointermove', e => {
  if(!cmode) return;
  const p = cropPos(e), dx = p.x - cstart.p.x, dy = p.y - cstart.p.y, s = cstart.r;
  const IW = origSrc.width, IH = origSrc.height, mn = MINC / cds;
  if(cmode === 'move'){
    cr.x = clamp(s.x + dx, 0, IW - s.w); cr.y = clamp(s.y + dy, 0, IH - s.h);
  } else {
    let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
    if(cmode[1] === 'l') x1 = clamp(s.x + dx, 0, x2 - mn); else x2 = clamp(s.x + s.w + dx, x1 + mn, IW);
    if(cmode[0] === 't') y1 = clamp(s.y + dy, 0, y2 - mn); else y2 = clamp(s.y + s.h + dy, y1 + mn, IH);
    cr = {x: x1, y: y1, w: x2 - x1, h: y2 - y1};
  }
  cropDraw();
});
const endCrop = () => { cmode = null; };
cropCv.addEventListener('pointerup', endCrop); cropCv.addEventListener('pointercancel', endCrop);
$('cropBtn').onclick = openCrop;
$('cropCancel').onclick = () => { cropOv.style.display = 'none'; };
$('cropFull').onclick = () => { cr = {x: 0, y: 0, w: origSrc.width, h: origSrc.height}; cropDraw(); };
$('cropOk').onclick = () => {
  const k = Math.min(1, 1600 / Math.max(cr.w, cr.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(cr.w*k)); c.height = Math.max(1, Math.round(cr.h*k));
  c.getContext('2d').drawImage(origSrc, cr.x, cr.y, cr.w, cr.h, 0, 0, c.width, c.height);
  tattooSrc = c; buildInk();
  cropOv.style.display = 'none';
  toast('برش انجام شد.');
};

// ---------- دوربین ----------
async function openCamera(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: facing}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false
    });
  } catch(err){
    toast('دوربین باز نشد. اجازه‌ی دوربین را بده و مطمئن شو صفحه با HTTPS باز شده است.');
    return false;
  }
  video.srcObject = stream;
  await video.play();
  const tr = stream.getVideoTracks()[0];
  const s = tr.getSettings ? tr.getSettings() : {};
  mirror = (s.facingMode || facing) === 'user';
  cv.classList.toggle('mirror', mirror);
  tx = null;
  return true;
}
$('startBtn').onclick = async () => {
  if(!tattooSrc){ toast('اول طرح تتو را انتخاب کن.'); return; }
  $('startBtn').disabled = true;
  const ok = await openCamera();
  $('startBtn').disabled = false;
  if(!ok) return;
  hint.style.display = 'none';
  $('camBtn').disabled = false; $('snapBtn').disabled = false;
  $('startBtn').textContent = 'دوربین روشن است';
  if(!running){ running = true; requestAnimationFrame(loop); }
};
$('camBtn').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; await openCamera(); };

// ---------- جابه‌جایی، بزرگ/کوچک و چرخاندن با انگشت ----------
const ptrs = new Map(); let g = null;
function toCv(e){
  const r = cv.getBoundingClientRect();
  let x = (e.clientX - r.left) / r.width * cv.width;
  const y = (e.clientY - r.top) / r.height * cv.height;
  if(mirror) x = cv.width - x;
  return {x, y};
}
function startGesture(){
  const a = [...ptrs.values()];
  if(!a.length){ g = null; return; }
  g = {tx, ty, sc, rot};
  if(a.length === 1) g.p0 = a[0];
  else {
    g.d0 = Math.hypot(a[1].x - a[0].x, a[1].y - a[0].y) || 1;
    g.a0 = Math.atan2(a[1].y - a[0].y, a[1].x - a[0].x);
    g.m0 = {x: (a[0].x + a[1].x)/2, y: (a[0].y + a[1].y)/2};
  }
}
cv.addEventListener('pointerdown', e => {
  if(!ink || tx == null) return;
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, toCv(e));
  startGesture();
});
cv.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId) || !g) return;
  ptrs.set(e.pointerId, toCv(e));
  const a = [...ptrs.values()];
  if(a.length === 1 && g.p0){
    tx = g.tx + (a[0].x - g.p0.x); ty = g.ty + (a[0].y - g.p0.y);
  } else if(a.length >= 2 && g.d0){
    const d = Math.hypot(a[1].x - a[0].x, a[1].y - a[0].y) || 1;
    const ang = Math.atan2(a[1].y - a[0].y, a[1].x - a[0].x);
    const m = {x: (a[0].x + a[1].x)/2, y: (a[0].y + a[1].y)/2};
    sc = clamp(g.sc * d / g.d0, 0.1, 8);
    rot = g.rot + (ang - g.a0);
    tx = g.tx + (m.x - g.m0.x); ty = g.ty + (m.y - g.m0.y);
  }
});
const upPtr = e => { ptrs.delete(e.pointerId); startGesture(); };
cv.addEventListener('pointerup', upPtr); cv.addEventListener('pointercancel', upPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); sc = clamp(sc * Math.exp(-e.deltaY * 0.001), 0.1, 8); }, {passive:false});

// ---------- تشخیص پوست (رنگ، در YCbCr) و لبه‌ی عضو ----------
const MW = 192;
const lowCv = document.createElement('canvas'), lowCtx = lowCv.getContext('2d', {willReadFrequently:true});
const maskCv = document.createElement('canvas'), maskCtx = maskCv.getContext('2d');
const tcv = document.createElement('canvas'), tcx = tcv.getContext('2d');
let mask = null, mw = 0, mh = 0, skinReady = false, noSkin = false, skTick = 0, eL = null, eR = null;

function sampleSkin(x, y){
  const r = 5, sx = Math.round(x) - r, sy = Math.round(y) - r;
  if(sx < 0 || sy < 0 || sx + 2*r >= cv.width || sy + 2*r >= cv.height) return;
  const d = ctx.getImageData(sx, sy, 2*r + 1, 2*r + 1).data;
  let sum = 0, n = 0;
  for(let i = 0; i < d.length; i += 4){ sum += (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) / 255; n++; }
  skinL = skinL*0.6 + (sum/n)*0.4;
}

function updateSkin(p){
  if(skinReady && (skTick++ % 3) !== 0) return;
  const cw = cv.width, ch = cv.height;
  const W = MW, H = Math.max(8, Math.round(MW*ch/cw));
  if(lowCv.width !== W || lowCv.height !== H){
    lowCv.width = W; lowCv.height = H; maskCv.width = W; maskCv.height = H;
    mask = new Uint8Array(W*H); mw = W; mh = H; skinReady = false;
  }
  lowCtx.drawImage(cv, 0, 0, W, H);
  const d = lowCtx.getImageData(0, 0, W, H).data;
  const px = clamp(Math.round(p.x*W/cw), 3, W-4), py = clamp(Math.round(p.y*H/ch), 3, H-4);
  const ycc = i => {
    const r = d[i], g2 = d[i+1], b = d[i+2];
    return [0.299*r + 0.587*g2 + 0.114*b, 128 - 0.168736*r - 0.331264*g2 + 0.5*b, 128 + 0.5*r - 0.418688*g2 - 0.081312*b];
  };
  let sY = 0, sCb = 0, sCr = 0, n = 0;
  for(let dy = -3; dy <= 3; dy++) for(let dx = -3; dx <= 3; dx++){
    const c = ycc(((py+dy)*W + px + dx)*4); sY += c[0]; sCb += c[1]; sCr += c[2]; n++;
  }
  const Y0 = sY/n, Cb0 = sCb/n, Cr0 = sCr/n;
  const gate = (cb, cr) => cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173;
  const refSkin = gate(Cb0, Cr0);
  const raw = new Uint8Array(W*H);
  for(let k = 0; k < W*H; k++){
    const c = ycc(k*4);
    let ok = gate(c[1], c[2]);
    if(ok && refSkin) ok = Math.abs(c[1]-Cb0) < 16 && Math.abs(c[2]-Cr0) < 16 && Math.abs(c[0]-Y0) < 75;
    raw[k] = ok ? 1 : 0;
  }
  for(let y = 1; y < H-1; y++) for(let x = 1; x < W-1; x++){      // حذف نقطه‌های پراکنده
    let c = 0;
    for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++) c += raw[(y+dy)*W + x + dx];
    mask[y*W + x] = c >= 5 ? 1 : 0;
  }
  const img = maskCtx.createImageData(W, H);
  for(let k = 0; k < W*H; k++) img.data[k*4+3] = mask[k] ? 255 : 0;
  maskCtx.putImageData(img, 0, 0);
  let cnt = 0, tot = 0;
  for(let dy = -7; dy <= 7; dy++) for(let dx = -7; dx <= 7; dx++){
    const x = px+dx, y = py+dy;
    if(x >= 0 && x < W && y >= 0 && y < H){ cnt += mask[y*W + x]; tot++; }
  }
  noSkin = cnt/Math.max(1, tot) < 0.3;
  skinReady = true;
}

// فاصله‌ی مرکز طرح تا لبه‌ی پوست در دو سمت (در راستای عرض طرح)
function edgesAt(p, ang){
  if(!skinReady || noSkin) return null;
  const k = mw / cv.width, nx = Math.cos(ang), ny = Math.sin(ang);
  const maxT = mw * 0.35;
  function march(sign){
    let miss = 0, last = 0;
    for(let t = 0; t < maxT; t += 0.5){
      const x = Math.round(p.x*k + sign*nx*t), y = Math.round(p.y*k + sign*ny*t);
      const inside = x >= 0 && x < mw && y >= 0 && y < mh;
      if(inside && mask[y*mw + x]){ miss = 0; last = t; }
      else if(++miss >= 3) break;
    }
    return last / k;
  }
  const hl = march(-1), hr = march(1);
  if(hl + hr < p.W * 0.25) return null;
  eL = eL == null ? hl : eL*0.65 + hl*0.35; eR = eR == null ? hr : eR*0.65 + hr*0.35;
  return {hl: eL, hr: eR};
}

// طرح را مثل استوانه می‌پیچد: نوارهای باریک، فشرده‌شده و کم‌رنگ‌تر به سمت لبه‌ها
function drawStrips(t, Wt, Ht, R, c0){
  const n = 48, lim = Math.PI/2 - 0.04;
  const th0 = Math.asin(clamp(-c0/R, -0.98, 0.98)), sw = ink.width/n;
  for(let i = 0; i < n; i++){
    let th1 = th0 + ((i/n) - 0.5)*Wt/R, th2 = th0 + (((i+1)/n) - 0.5)*Wt/R;
    if(th2 <= -lim || th1 >= lim) continue;
    th1 = Math.max(th1, -lim); th2 = Math.min(th2, lim);
    const x1 = c0 + R*Math.sin(th1), x2 = c0 + R*Math.sin(th2);
    if(x2 <= x1) continue;
    t.globalAlpha = Math.pow(Math.cos((th1 + th2)/2), 0.5);
    t.drawImage(ink, i*sw, 0, sw, ink.height, x1, -Ht/2, (x2 - x1) + 0.6, Ht);
  }
}

function drawTattoo(p){
  updateSkin(p);
  const tD = clamp((0.55 - skinL)/0.35, 0, 1);                   // روی پوست تیره غلیظ‌تر
  const alpha = clamp(opV * (1 + 0.45*tD), 0, 1);
  const s = (p.W * 1.6) / Math.max(ink.width, ink.height);
  const Wt = ink.width*s, Ht = ink.height*s;
  const useClip = skinReady && !noSkin;
  setStatus(skinReady && noSkin ? 'پوستی زیر طرح پیدا نشد؛ طرح بدون برش نشان داده می‌شود. عضو را زیر طرح ببر یا نور را بهتر کن.' : '');
  let t;
  if(useClip){
    if(tcv.width !== cv.width || tcv.height !== cv.height){ tcv.width = cv.width; tcv.height = cv.height; }
    tcx.setTransform(1, 0, 0, 1, 0, 0); tcx.globalCompositeOperation = 'source-over'; tcx.globalAlpha = 1;
    tcx.clearRect(0, 0, tcv.width, tcv.height);
    t = tcx;
  } else {
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = alpha;
    t = ctx;
  }
  t.save();
  t.translate(p.x, p.y); t.rotate(p.a);
  let R, c0;
  const e = edgesAt(p, p.a);
  if(e){ R = (e.hl + e.hr)/2; c0 = (e.hr - e.hl)/2; } else { R = p.W * 0.55; c0 = 0; }
  if(R > 4) drawStrips(t, Wt, Ht, R, c0);
  else { t.globalAlpha = useClip ? 1 : alpha; t.drawImage(ink, -Wt/2, -Ht/2, Wt, Ht); }
  t.restore();
  if(useClip){
    tcx.setTransform(1, 0, 0, 1, 0, 0); tcx.globalAlpha = 1; tcx.globalCompositeOperation = 'destination-in';
    tcx.drawImage(maskCv, 0, 0, tcv.width, tcv.height);
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = alpha;
    ctx.drawImage(tcv, 0, 0);
    ctx.restore();
  } else ctx.restore();
}

// ---------- حلقه‌ی اصلی ----------
function loop(){
  requestAnimationFrame(loop);
  if(!stream || video.readyState < 2 || !video.videoWidth) return;
  const cw = video.videoWidth, ch = video.videoHeight;
  if(cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
  if(tx == null || lastW !== cw || lastH !== ch){ tx = cw/2; ty = ch/2; lastW = cw; lastH = ch; }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(video, 0, 0, cw, ch);
  if(!ink) return;
  const p = {x: tx, y: ty, W: Math.min(cw, ch) * 0.25 * sc, a: rot};
  if((frame++ % 15) === 0) sampleSkin(p.x, p.y);
  drawTattoo(p);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

// ---------- ثبت عکس ----------
$('snapBtn').onclick = () => {
  cv.toBlob(b => {
    if(!b){ toast('ساخت تصویر ناموفق بود؛ دوباره امتحان کن.'); return; }
    const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    let file = null; try{ file = new File([b], 'inkoo-ar.png', {type:'image/png'}); }catch(_){}
    const dl = () => {
      const u = URL.createObjectURL(b), a = document.createElement('a');
      a.href = u; a.download = 'inkoo-ar.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 60000);
    };
    if(touch && file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'INKOO'}).catch(err => { if(!err || err.name !== 'AbortError') dl(); });
    } else dl();
  }, 'image/png');
};
