<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تتو زنده روی بدن · INKOO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D0D0D;--card:#181818;--text:#F5F5F0;--mute:#A3A3A3;--red:#E50914}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  body{margin:0;background:#000;color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;height:100vh;height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%}
  header{position:fixed;top:0;right:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;font-weight:700;font-size:14px;text-shadow:0 1px 4px #000;pointer-events:none}
  header span{color:var(--red)}
  #stageWrap{position:fixed;inset:0;background:#000;z-index:1}
  canvas#cv{display:block;width:100%;height:100%;object-fit:cover;background:#111;touch-action:none}
  canvas#cv.mirror{transform:scaleX(-1)}
  #status{position:absolute;left:12px;right:12px;top:calc(44px + env(safe-area-inset-top));text-align:center;font-size:13px;color:var(--text);background:rgba(0,0,0,.55);border-radius:8px;padding:6px 10px;pointer-events:none}
  #hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:24px;font-size:14px;line-height:2;pointer-events:none}
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none;display:flex;flex-direction:column;gap:8px}
  #ui>*{pointer-events:auto}
  #sheet{display:none;background:rgba(14,14,14,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;max-height:42vh;overflow-y:auto}
  #sheet.open{display:block}
  .dock{display:flex;gap:8px;align-items:center;justify-content:center}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .btn{flex:1;min-width:90px;background:rgba(20,20,20,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:12px;min-height:44px;padding:10px 8px;font:inherit;font-size:13px;text-align:center;cursor:pointer}
  .dock .btn{min-width:0}
  .btn.primary{background:rgba(229,9,20,.85);border-color:var(--red);font-weight:700}
  .btn.on{border-color:var(--red)}
  .btn:disabled{opacity:.4}
  #snapBtn{flex:none;width:64px;height:64px;min-height:64px;border-radius:50%;padding:0;font-size:12px;background:rgba(245,245,240,.9);color:#000;border:4px solid rgba(255,255,255,.5)}
  #snapBtn:disabled{background:rgba(245,245,240,.35)}
  label.ctl{display:block;font-size:12px;color:var(--text);margin-bottom:6px}
  input[type=range]{height:32px;width:100%;accent-color:var(--red)}
  input[type=file]{display:none}
  .note{font-size:12px;color:#ccc;margin:0;line-height:1.8}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));background:#222;border:1px solid var(--red);color:var(--text);padding:12px;border-radius:10px;font-size:13px;text-align:center;display:none;z-index:80}
  #cropOv{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
  #cropCv{touch-action:none;border-radius:6px;background:#222}
  #cropOv .row{width:100%;max-width:420px;margin:0}
</style>
</head>
<body>
<header>INK<span>OO</span> · تتو زنده روی بدن</header>

<div id="stageWrap">
  <canvas id="cv" width="640" height="480"></canvas>
  <div id="hint">«شروع دوربین» را بزن و بعد طرح تتو را انتخاب کن.</div>
  <div id="status" style="display:none"></div>
</div>

<div id="ui">
  <div id="sheet">
    <div class="row">
      <button class="btn" id="cropBtn" disabled>برش طرح</button>
      <button class="btn" id="blackBtn">سیاه و سفید</button>
      <button class="btn" id="flipBtn">برعکس کردن</button>
      <button class="btn" id="resetBtn">وسط‌چین</button>
      <button class="btn" id="camBtn" disabled>تعویض دوربین</button>
      <button class="btn" id="torchBtn" disabled>فلش</button>
    </div>
    <label class="ctl">غلظت جوهر<input id="sOp" type="range" min="20" max="100" value="85"></label>
    <div class="note">با یک انگشت طرح را جابه‌جا کن؛ با دو انگشت بزرگ، کوچک و بچرخانش. طرح فقط روی پوست دیده می‌شود. عضو را وسط کادر و در نور خوب بگیر. تصویر دوربین جایی ارسال نمی‌شود.</div>
  </div>
  <div class="dock">
    <label class="btn" for="tattooIn">طرح تتو</label>
    <button class="btn primary" id="startBtn">شروع دوربین</button>
    <button class="btn" id="snapBtn" disabled>عکس</button>
    <button class="btn" id="moreBtn">تنظیمات</button>
    <input id="tattooIn" type="file" accept="image/*">
  </div>
</div>

<div id="cropOv">
  <canvas id="cropCv"></canvas>
  <div class="row">
    <button class="btn primary" id="cropOk">تایید برش</button>
    <button class="btn" id="cropFull">کل تصویر</button>
    <button class="btn" id="cropCancel">لغو</button>
  </div>
</div>
<div id="toast"></div>

<script type="module">
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const hint = $('hint'), statusEl = $('status');
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.setAttribute('playsinline', '');

let stream = null, facing = 'environment', running = false, mirror = false;
let origSrc = null, tattooSrc = null, ink = null, blackInk = false, flipInk = false, inkVer = 0;
let opV = 0.85, skinL = 0.6, frame = 0;
// مقدارهای هدف (از انگشت) و مقدارهای نمایشی (نرم‌شده)
let tx = null, ty = null, sc = 1, rot = 0, lastW = 0, lastH = 0;
let dtx = null, dty = 0, dsc = 1, drot = 0, lastT = 0;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 4500);
}
let lastStatus = '';
function setStatus(msg){
  if(msg === lastStatus) return;
  lastStatus = msg;
  if(!msg){ statusEl.style.display = 'none'; return; }
  statusEl.textContent = msg; statusEl.style.display = 'block';
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t*t*(3 - 2*t); };

// ---------- ساخت جوهر از طرح ----------
// حالت رنگی: رنگ‌های اصلی دقیقاً حفظ می‌شود؛ فقط زمینه‌ی کاغذ حذف می‌شود
//            (رنگ واقعیِ هر پیکسل از زمینه جدا می‌شود تا هاله‌ی خاکستری نماند).
// حالت سیاه‌وسفید: طرح خاکستری/مشکی می‌شود و سایه‌روشنش حفظ می‌شود.
const COLS = 40, ROWS = 12;
let inkGrid = null;     // کدام سلول‌های مش واقعاً جوهر دارند (برای سرعت)

function buildInk(){
  if(!tattooSrc) return;
  const k = Math.min(1, 1280 / Math.max(tattooSrc.width, tattooSrc.height));
  const w = Math.max(1, Math.round(tattooSrc.width*k)), h = Math.max(1, Math.round(tattooSrc.height*k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d', {willReadFrequently:true}); cx.drawImage(tattooSrc, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h), p = d.data;

  // آیا خود فایل زمینه‌ی شفاف دارد؟
  let tr = 0, tot = 0;
  for(let i = 3; i < p.length; i += 16){ tot++; if(p[i] < 250) tr++; }
  const hasAlpha = tr/Math.max(1, tot) > 0.02;

  // روشنایی کاغذ از لبه‌ی تصویر حدس زده می‌شود
  const hist = new Array(256).fill(0); let cnt = 0;
  const bw = Math.max(2, Math.round(Math.min(w, h)*0.03));
  for(let y = 0; y < h; y++){
    const edgeRow = y < bw || y >= h-bw;
    for(let x = 0; x < w; x++){
      if(!edgeRow && x >= bw && x < w-bw){ x = w-bw-1; continue; }
      const q = (y*w + x)*4;
      if(p[q+3] > 200){ hist[Math.round(0.299*p[q] + 0.587*p[q+1] + 0.114*p[q+2])]++; cnt++; }
    }
  }
  let bg = 255;
  if(cnt > 20){ let acc = 0; for(let m = 0; m < 256; m++){ acc += hist[m]; if(acc >= cnt/2){ bg = m; break; } } if(bg < 140) bg = 255; }
  const cut = 0.12;
  const shape = a0 => Math.pow(clamp((a0 - cut)/(1 - cut), 0, 1), 0.85);

  for(let i = 0; i < p.length; i += 4){
    const r = p[i], g = p[i+1], b = p[i+2];
    if(blackInk){
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const gray = Math.round(clamp(lum*0.5, 6, 70));
      p[i] = gray; p[i+1] = gray; p[i+2] = gray;
      if(!hasAlpha){
        const dk = clamp((bg - lum)/bg, 0, 1);
        p[i+3] = Math.round(p[i+3] * shape(dk));
      }
    } else if(!hasAlpha){
      const m = Math.min(r, g, b);
      const a0 = clamp((bg - m)/bg, 0, 1);
      if(a0 > 0.004){
        const inv = 1 / a0, base = bg*(1 - a0);
        p[i]   = clamp((r - base)*inv, 0, 255);
        p[i+1] = clamp((g - base)*inv, 0, 255);
        p[i+2] = clamp((b - base)*inv, 0, 255);
      }
      p[i+3] = Math.round(p[i+3] * shape(a0));
    }
  }
  cx.putImageData(d, 0, 0);

  // نقشه‌ی سلول‌های دارای جوهر
  const grid = new Uint8Array(COLS*ROWS);
  for(let y = 0; y < h; y++){
    const cy = Math.min(ROWS-1, Math.floor(y*ROWS/h)) * COLS;
    for(let x = 0; x < w; x++){
      if(p[(y*w + x)*4 + 3] > 10){ let col = Math.min(COLS-1, Math.floor(x*COLS/w)); if(flipInk) col = COLS-1-col; grid[cy + col] = 1; }
    }
  }
  inkGrid = grid;
  if(flipInk){
    const f = document.createElement('canvas'); f.width = w; f.height = h;
    const fx = f.getContext('2d'); fx.translate(w, 0); fx.scale(-1, 1); fx.drawImage(c, 0, 0);
    ink = f;
  } else ink = c;
  inkVer++;
}

// ---------- ورودی طرح ----------
$('tattooIn').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    URL.revokeObjectURL(u);
    origSrc = img; tattooSrc = img; buildInk();
    tx = null; sc = 1; rot = 0;
    $('cropBtn').disabled = false;
    toast('طرح آماده شد.');
    if(!running) hint.textContent = 'طرح آماده است؛ «شروع دوربین» را بزن.';
  };
  img.onerror = () => { URL.revokeObjectURL(u); toast('این فایل باز نشد. یک عکس JPG یا PNG انتخاب کن.'); };
  img.src = u;
});
$('sOp').oninput = e => { opV = +e.target.value / 100; };
$('flipBtn').onclick = e => { flipInk = !flipInk; e.currentTarget.classList.toggle('on', flipInk); buildInk(); };
$('resetBtn').onclick = () => { tx = null; sc = 1; rot = 0; };
$('blackBtn').onclick = e => { blackInk = !blackInk; e.currentTarget.classList.toggle('on', blackInk); buildInk(); };

// ---------- برش طرح ----------
const cropOv = $('cropOv'), cropCv = $('cropCv'), cctx = cropCv.getContext('2d');
let cr = null, cds = 1, cmode = null, cstart = null;
const MINC = 30;
function cropDraw(){
  const W = cropCv.width, H = cropCv.height;
  cctx.clearRect(0, 0, W, H);
  cctx.drawImage(origSrc, 0, 0, W, H);
  const x = cr.x*cds, y = cr.y*cds, w = cr.w*cds, h = cr.h*cds;
  cctx.fillStyle = 'rgba(0,0,0,.6)';
  cctx.fillRect(0, 0, W, y); cctx.fillRect(0, y+h, W, H-y-h);
  cctx.fillRect(0, y, x, h); cctx.fillRect(x+w, y, W-x-w, h);
  cctx.strokeStyle = '#E50914'; cctx.lineWidth = 2; cctx.strokeRect(x, y, w, h);
  cctx.fillStyle = '#E50914';
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(q => { cctx.beginPath(); cctx.arc(q[0], q[1], 11, 0, 6.283); cctx.fill(); });
}
function openCrop(){
  if(!origSrc) return;
  const maxW = window.innerWidth - 24, maxH = window.innerHeight - 140;
  cds = Math.min(maxW / origSrc.width, maxH / origSrc.height);
  cropCv.width = Math.round(origSrc.width*cds); cropCv.height = Math.round(origSrc.height*cds);
  cropCv.style.width = cropCv.width + 'px'; cropCv.style.height = cropCv.height + 'px';
  cr = {x: 0, y: 0, w: origSrc.width, h: origSrc.height};
  cropOv.style.display = 'flex';
  cropDraw();
}
function cropPos(e){
  const r = cropCv.getBoundingClientRect();
  return {x: (e.clientX - r.left) / cds, y: (e.clientY - r.top) / cds};
}
cropCv.addEventListener('pointerdown', e => {
  const p = cropPos(e), tol = 30 / cds;
  const cs = {tl:[cr.x, cr.y], tr:[cr.x+cr.w, cr.y], bl:[cr.x, cr.y+cr.h], br:[cr.x+cr.w, cr.y+cr.h]};
  cmode = null;
  for(const k in cs){ if(Math.hypot(p.x - cs[k][0], p.y - cs[k][1]) < tol){ cmode = k; break; } }
  if(!cmode && p.x > cr.x && p.x < cr.x+cr.w && p.y > cr.y && p.y < cr.y+cr.h) cmode = 'move';
  if(!cmode) return;
  cstart = {p, r: {...cr}};
  cropCv.setPointerCapture(e.pointerId);
});
cropCv.addEventListener('pointermove', e => {
  if(!cmode) return;
  const p = cropPos(e), dx = p.x - cstart.p.x, dy = p.y - cstart.p.y, s = cstart.r;
  const IW = origSrc.width, IH = origSrc.height, mn = MINC / cds;
  if(cmode === 'move'){
    cr.x = clamp(s.x + dx, 0, IW - s.w); cr.y = clamp(s.y + dy, 0, IH - s.h);
  } else {
    let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
    if(cmode[1] === 'l') x1 = clamp(s.x + dx, 0, x2 - mn); else x2 = clamp(s.x + s.w + dx, x1 + mn, IW);
    if(cmode[0] === 't') y1 = clamp(s.y + dy, 0, y2 - mn); else y2 = clamp(s.y + s.h + dy, y1 + mn, IH);
    cr = {x: x1, y: y1, w: x2 - x1, h: y2 - y1};
  }
  cropDraw();
});
const endCrop = () => { cmode = null; };
cropCv.addEventListener('pointerup', endCrop); cropCv.addEventListener('pointercancel', endCrop);
$('cropBtn').onclick = openCrop;
$('cropCancel').onclick = () => { cropOv.style.display = 'none'; };
$('cropFull').onclick = () => { cr = {x: 0, y: 0, w: origSrc.width, h: origSrc.height}; cropDraw(); };
$('cropOk').onclick = () => {
  const k = Math.min(1, 1600 / Math.max(cr.w, cr.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(cr.w*k)); c.height = Math.max(1, Math.round(cr.h*k));
  c.getContext('2d').drawImage(origSrc, cr.x, cr.y, cr.w, cr.h, 0, 0, c.width, c.height);
  tattooSrc = c; buildInk();
  cropOv.style.display = 'none';
  toast('برش انجام شد.');
};

// ---------- دوربین ----------
const CAM_W = 1280, CAM_H = 960;   // اگر روی گوشی ضعیف کند شد: 1600 و 1200
async function openCamera(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  // رزولوشن بالا و نسبت 4:3 (کل سنسور)، همیشه به‌صورت «عرض > ارتفاع».
  // قبلاً در حالت عمودی 720×1280 خواسته می‌شد؛ مرورگر آن را از تصویر افقی «برش» می‌زد
  // و نتیجه زوم‌شده و کم‌کیفیت بود. حالا مرورگر خودش تصویر را می‌چرخاند و کل کادر را نگه می‌دارد.
  const base = {facingMode: {ideal: facing}};
  try{
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: Object.assign({}, base, {width: {ideal: CAM_W}, height: {ideal: CAM_H}, frameRate: {ideal: 30}}), audio: false
      });
    } catch(e1){
      stream = await navigator.mediaDevices.getUserMedia({video: base, audio: false});
    }
  } catch(err){
    toast('دوربین باز نشد. اجازه‌ی دوربین را بده و مطمئن شو صفحه با HTTPS باز شده است.');
    return false;
  }
  video.srcObject = stream; lastVT = -1;
  await video.play();
  const tr = stream.getVideoTracks()[0];
  // اگر دوربین زوم دارد، روی کمترین مقدار (زاویه‌ی کامل) بگذار تا تصویر زوم نشود
  try{
    const zc = tr.getCapabilities ? tr.getCapabilities() : {};
    if(zc.zoom && typeof zc.zoom.min === 'number') await tr.applyConstraints({advanced: [{zoom: zc.zoom.min}]});
  } catch(_){}
  const s = tr.getSettings ? tr.getSettings() : {};
  mirror = (s.facingMode || facing) === 'user';
  cv.classList.toggle('mirror', mirror);
  tx = null; skinReady = false; eL = null; eR = null; wKey = '';
  // فلش (چراغ قوه): فقط وقتی دوربین پشتی آن را پشتیبانی کند فعال می‌شود
  torchOn = false; torchTrack = tr;
  const caps = tr.getCapabilities ? tr.getCapabilities() : {};
  torchOk = !!caps.torch;
  $('torchBtn').disabled = !torchOk;
  $('torchBtn').classList.remove('on');
  return true;
}
let torchOn = false, torchOk = false, torchTrack = null;
$('torchBtn').onclick = async () => {
  if(!torchOk || !torchTrack){ toast('این دوربین فلش را پشتیبانی نمی‌کند.'); return; }
  try{
    await torchTrack.applyConstraints({advanced: [{torch: !torchOn}]});
    torchOn = !torchOn;
    $('torchBtn').classList.toggle('on', torchOn);
  } catch(_){ toast('روشن کردن فلش ممکن نشد.'); }
};
$('startBtn').onclick = async () => {
  $('startBtn').disabled = true;
  const ok = await openCamera();
  $('startBtn').disabled = false;
  if(!ok) return;
  hint.style.display = 'none';
  $('camBtn').disabled = false; $('snapBtn').disabled = false;
  $('startBtn').style.display = 'none';
  lockScreen();
  if(!running){ running = true; requestAnimationFrame(loop); }
};
let wake = null;
async function lockScreen(){ try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(_){} }
document.addEventListener('visibilitychange', async () => {
  if(document.hidden){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
  else if(running && !stream){ if(await openCamera()) lockScreen(); }
});
$('camBtn').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; await openCamera(); };

// ---------- جابه‌جایی، بزرگ/کوچک و چرخاندن با انگشت ----------
// ---------- مرحله ۲: فیلتر ضدلرزش (One Euro) ----------
// آهسته حرکت دادن = خیلی نرم و بدون لرزش؛ تند حرکت دادن = بدون تأخیر.
const fX = {}, fY = {}, fS = {}, fR = {};
function euroReset(){ for(const f of [fX, fY, fS, fR]){ f.x = null; } }
function euro(f, v, dt, minC, beta){
  const lp = (a, prev, x) => prev + a*(x - prev);
  const al = c => 1 / (1 + (1/(2*Math.PI*c))/dt);
  if(f.x == null){ f.x = v; f.raw = v; f.dx = 0; return v; }
  const d = (v - f.raw)/dt; f.raw = v;
  f.dx = lp(al(1), f.dx, d);
  f.x = lp(al(minC + beta*Math.abs(f.dx)), f.x, v);
  return f.x;
}
const ptrs = new Map(); let g = null;
function toCv(e){
  const r = cv.getBoundingClientRect();
  let px = e.clientX - r.left;
  const py = e.clientY - r.top;
  if(mirror) px = r.width - px;
  const k = Math.max(r.width / cv.width, r.height / cv.height);
  const ox = (r.width - cv.width*k)/2, oy = (r.height - cv.height*k)/2;
  return {x: (px - ox)/k, y: (py - oy)/k};
}

// ---------- تشخیص پوست (رنگ، در YCbCr) و لبه‌ی عضو ----------
const MW = 192;
const lowCv = document.createElement('canvas'), lowCtx = lowCv.getContext('2d', {willReadFrequently:true});
const maskCv = document.createElement('canvas'), maskCtx = maskCv.getContext('2d');
const tcv = document.createElement('canvas'), tcx = tcv.getContext('2d');
const wcv = document.createElement('canvas'), wcx = wcv.getContext('2d');
let wKey = '';
let mask = null, maskF = null, blurB = null, mw = 0, mh = 0;
let segLast = 0, segEvery = 150;
let seg = null, segBuf = new Uint8Array(0), segOK = false, segSum = 0;
(async () => { try{
  const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const m = await import(V + '/vision_bundle.mjs');
  const fs = await m.FilesetResolver.forVisionTasks(V + '/wasm');
  const mk = d => m.ImageSegmenter.createFromOptions(fs, {baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite', delegate:d}, runningMode:'VIDEO', outputCategoryMask:true, outputConfidenceMasks:false});

}catch(e){ seg = null; } })();
let skinReady = false, noSkin = false, skTick = 0, eL = null, eR = null;

function updateSkin(p){
  if(skinReady && (skTick++ % 3) !== 0) return;
  const cw = cv.width, ch = cv.height;
  const W = MW, H = Math.max(8, Math.round(MW*ch/cw));
  if(lowCv.width !== W || lowCv.height !== H){
    lowCv.width = W; lowCv.height = H; maskCv.width = W; maskCv.height = H;
    mask = new Uint8Array(W*H); maskF = new Float32Array(W*H); blurB = new Float32Array(W*H);
    mw = W; mh = H; skinReady = false;
  }
  lowCtx.drawImage(cv, 0, 0, W, H);
  if(gl){ gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, tB); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, lowCv); }

  const nowS = performance.now();
  if(seg && nowS - segLast > segEvery){ segLast = nowS; try{ seg.segmentForVideo(lowCv, nowS, r => {      // مدل: دسته ۲ = پوست بدن، ۳ = پوست صورت
    const a = r.categoryMask.getAsUint8Array();
    if(a.length === W*H){ if(segBuf.length !== a.length) segBuf = new Uint8Array(a.length); segSum = 0;
      for(let k = 0; k < a.length; k++){ const v = (a[k] === 2 || a[k] === 3) ? 1 : 0; segBuf[k] = v; segSum += v; } segOK = true; }
  }); }catch(e){ segOK = false; } segEvery = clamp((performance.now() - nowS)*4, 120, 800); }

  for(let dy = -3; dy <= 3; dy++) for(let dx = -3; dx <= 3; dx++){

    let c = 0;

}

// فاصله‌ی مرکز طرح تا لبه‌ی پوست در دو سمت (در راستای عرض طرح)
function edgesAt(p, ang){
  if(!skinReady || noSkin) return null;
  const k = mw / cv.width, nx = Math.cos(ang), ny = Math.sin(ang);
  const maxT = mw * 0.35;
  function march(sign){
    let miss = 0, last = 0;
    for(let t = 0; t < maxT; t += 0.5){
      const x = Math.round(p.x*k + sign*nx*t), y = Math.round(p.y*k + sign*ny*t);
      const inside = x >= 0 && x < mw && y >= 0 && y < mh;
      if(inside && mask[y*mw + x]){ miss = 0; last = t; }
      else if(++miss >= 3) break;
    }
    return last / k;
  }
  const hl = march(-1), hr = march(1);
  if(hl + hr < p.W * 0.25) return null;
  eL = eL == null ? hl : eL*0.75 + hl*0.25; eR = eR == null ? hr : eR*0.75 + hr*0.25;
  return {hl: eL, hr: eR};
}

// ---------- پیچیدن طرح دور عضو (استوانه) ----------
// طول کمان حفظ می‌شود (جزئیات طرح کشیده نمی‌شود)، بخشی که از لبه‌ی عضو
// به پشت می‌رود بریده می‌شود، و محو شدن نرم کنار لبه با یک گرادیان انجام می‌شود.
function drawWrapped(t, Wt, Ht, R, c0){
  const lim = Math.PI/2 - 0.03;
  const span = clamp(Wt / R, 0.05, Math.PI*1.9);                 // زاویه‌ای که طرح اشغال می‌کند
  const thC = Math.asin(clamp(-c0 / R, -0.94, 0.94));            // زاویه‌ی مرکز طرح روی استوانه
  const cs0 = Math.cos(thC);
  const yBend = Math.min(Ht * 0.14, Math.max(2, R * 0.07));
  const persp = Math.min(0.2, Math.max(0.03, Ht / Math.max(Wt, 1) * 0.16));
  const k0 = 1 / (1 - persp*(1 - cs0));
  const thAt = u => clamp(thC + span*(u - 0.5), -lim, lim);

  // نقاط مش
  const P = [];
  for(let j = 0; j <= ROWS; j++){
    const v = j/ROWS, row = [];
    for(let i = 0; i <= COLS; i++){
      const th = thAt(i/COLS), cs = Math.cos(th);
      row.push({
        x: c0 + R*Math.sin(th),
        y: (v - 0.5)*Ht*(1 - persp*(1 - cs))*k0 + (cs - cs0)*yBend
      });
    }
    P.push(row);
  }

  const sw = ink.width / COLS, sh = ink.height / ROWS;
  t.save();
  t.imageSmoothingEnabled = true; t.imageSmoothingQuality = 'high';

  function tri(x0,y0,x1,y1,x2,y2, tx0,ty0,tx1,ty1,tx2,ty2, sx,sy,sw0,sh0){
    if(Math.abs((x1-x0)*(y2-y0) - (x2-x0)*(y1-y0)) < 0.04) return;      // مثلث تباه‌شده
    const det = tx0*(ty1-ty2)+tx1*(ty2-ty0)+tx2*(ty0-ty1);
    if(Math.abs(det) < 1e-6) return;
    const aa = (x0*(ty1-ty2)+x1*(ty2-ty0)+x2*(ty0-ty1))/det;
    const cc = (x0*(tx2-tx1)+x1*(tx0-tx2)+x2*(tx1-tx0))/det;
    const ee = (x0*(tx1*ty2-tx2*ty1)+x1*(tx2*ty0-tx0*ty2)+x2*(tx0*ty1-tx1*ty0))/det;
    const bb = (y0*(ty1-ty2)+y1*(ty2-ty0)+y2*(ty0-ty1))/det;
    const dd = (y0*(tx2-tx1)+y1*(tx0-tx2)+y2*(tx1-tx0))/det;
    const ff = (y0*(tx1*ty2-tx2*ty1)+y1*(tx2*ty0-tx0*ty2)+y2*(tx0*ty1-tx1*ty0))/det;
    // مثلث را کمی بزرگ می‌کنیم تا بین سلول‌ها درز دیده نشود
    const gx = (x0+x1+x2)/3, gy = (y0+y1+y2)/3, gr = 0.35;
    const grow = (x, y) => { const dx = x-gx, dy = y-gy, l = Math.hypot(dx, dy) || 1; return [x + dx/l*gr, y + dy/l*gr]; };
    const q0 = grow(x0,y0), q1 = grow(x1,y1), q2 = grow(x2,y2);

    t.beginPath(); t.moveTo(q0[0],q0[1]); t.lineTo(q1[0],q1[1]); t.lineTo(q2[0],q2[1]); t.closePath(); t.clip();

    const rx = Math.max(0, sx-1), ry = Math.max(0, sy-1);
    const rw = Math.min(ink.width, sx+sw0+1) - rx, rh = Math.min(ink.height, sy+sh0+1) - ry;
    t.drawImage(ink, rx, ry, rw, rh, rx, ry, rw, rh);
    t.restore();
  }

  for(let j = 0; j < ROWS; j++){
    for(let i = 0; i < COLS; i++){
      if(inkGrid && !inkGrid[j*COLS + i]) continue;
      const a = P[j][i], b = P[j][i+1], c = P[j+1][i], d = P[j+1][i+1];
      const sx = i*sw, sy = j*sh;
      tri(a.x,a.y,b.x,b.y,c.x,c.y, sx,sy, sx+sw,sy, sx,sy+sh, sx,sy,sw,sh);
      tri(b.x,b.y,d.x,d.y,c.x,c.y, sx+sw,sy, sx+sw,sy+sh, sx,sy+sh, sx,sy,sw,sh);
    }
  }

  // محو شدن نرم به سمت لبه‌ی عضو (فقط شفافیت؛ رنگ جوهر دست نمی‌خورد)
  const xa = c0 + R*Math.sin(thAt(0)), xb = c0 + R*Math.sin(thAt(1));

}

const hasFilter = 'filter' in ctx;

// ---------- مرحله ۱: جوهر «زیر پوست» ----------
// بافت و سایه‌روشنِ خودِ پوست (منفذها، چین‌ها، برجستگی) از تصویر دوربین جدا می‌شود

const hcv = document.createElement('canvas'), hcx = hcv.getContext('2d');
const kcv = document.createElement('canvas'), kcx = kcv.getContext('2d');
function skinTexture(){

function drawTattoo2D(p){
  updateSkin(p);

  const alpha = bw ? clamp(opV * (1 + 0.45*tD), 0, 1) : opV;

  const useClip = skinReady && !noSkin;
  setStatus(skinReady && noSkin ? 'پوستی زیر طرح پیدا نشد؛ طرح بدون برش نشان داده می‌شود. عضو را زیر طرح ببر یا نور را بهتر کن.' : '');

  if(tcv.width !== cv.width || tcv.height !== cv.height){ tcv.width = cv.width; tcv.height = cv.height; }

  const key = [inkVer, Math.round(p.x*2), Math.round(p.y*2), Math.round(p.a*500), Math.round(Wt), Math.round(R*2), Math.round(c0*2)].join('|');

    wKey = key;
    wcx.setTransform(1, 0, 0, 1, 0, 0); wcx.clearRect(0, 0, wcv.width, wcv.height);
    wcx.save(); wcx.translate(p.x, p.y); wcx.rotate(p.a);

    tcx.globalCompositeOperation = 'source-over';
  }

  ctx.save();
  ctx.globalCompositeOperation = bw ? 'multiply' : 'source-over';
  ctx.globalAlpha = alpha;
  if(hasFilter) ctx.filter = (bw ? '' : 'saturate(0.9) ') + 'blur(' + Math.max(0.3, Math.min(cv.width, cv.height)/2600).toFixed(2) + 'px)';   // نرمیِ جوهر زیر پوست
  ctx.drawImage(tcv, 0, 0);
  ctx.restore();

  // بافت و سایه‌ی پوست روی خود جوهر
  if(doTex){
    if(kcv.width !== cv.width || kcv.height !== cv.height){ kcv.width = cv.width; kcv.height = cv.height; }
    kcx.setTransform(1, 0, 0, 1, 0, 0); kcx.globalCompositeOperation = 'source-over'; kcx.globalAlpha = 1;
    kcx.clearRect(0, 0, kcv.width, kcv.height);
    kcx.imageSmoothingEnabled = true; kcx.imageSmoothingQuality = 'high';
    kcx.drawImage(hcv, 0, 0, kcv.width, kcv.height);
    kcx.globalCompositeOperation = 'destination-in'; kcx.drawImage(tcv, 0, 0);   // فقط جایی که جوهر هست
    kcx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = clamp(alpha*0.75, 0, 0.7);
    ctx.drawImage(kcv, 0, 0);
    ctx.restore();
  }
}

// ---------- رندر WebGL: یک مش واحد، بدون درز؛ لبه‌ی نرم و بافت پوست داخل شیدر ----------
let mb = new Uint8Array(0), mbDirty = false, glInkVer = -1;
const glc = document.createElement('canvas');
let gl = null, glP = null, glU = {}, tV, tI, tM, tB, glB, mv = new Float32Array((COLS+1)*(ROWS+1)*5);
try{

in vec2 p; in vec2 t; in float f; uniform vec2 R; out vec2 vt; out vec2 vs; out float vf;
void main(){ vs = p/R; vt = t; vf = f; gl_Position = vec4(vs.x*2.-1., 1.-vs.y*2., 0., 1.); }`));
  gl.attachShader(glP, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; in vec2 vt; in vec2 vs; in float vf; out vec4 o;
uniform sampler2D V, I, M, B; uniform float op, bw, useM;
float L(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
void main(){
  vec4 k = texture(I, vt); vec3 ic = k.rgb / max(k.a, 1e-3);
  float m = useM > .5 ? smoothstep(.35, .65, texture(M, vs).r) : 1.;
  float a = k.a * m * vf * op;
  vec3 base = texture(V, vs).rgb;
  vec3 c = bw > .5 ? base * (ic*2. + vec3(.02,.04,.08)) : ic;
  float d = L(base) - L(texture(B, vs).rgb);       // بافت و سایه‌ی خود پوست
  c *= 1. + 2.5*d;
  o = vec4(clamp(c, 0., 1.), clamp(a, 0., 1.));
}`));
  gl.linkProgram(glP); if(!gl.getProgramParameter(glP, gl.LINK_STATUS)) throw 0;
  gl.useProgram(glP);
  for(const n of ['R','V','I','M','B','op','bw','useM']) glU[n] = gl.getUniformLocation(glP, n);
  glB = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, glB);
  [['p',2,0],['t',2,8],['f',1,16]].forEach(([n, z, o]) => { const l = gl.getAttribLocation(glP, n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, z, gl.FLOAT, false, 20, o); });
  const idx = []; for(let j = 0; j < ROWS; j++) for(let i = 0; i < COLS; i++){ const a = j*(COLS+1)+i, b = a+1, c = a+COLS+1, d = c+1; idx.push(a,b,c,b,d,c); }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  const mkT = (unit, mip) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  tV = mkT(0, false); tI = mkT(1, true); tM = mkT(2, false); tB = mkT(3, false);
  gl.uniform1i(glU.V, 0); gl.uniform1i(glU.I, 1); gl.uniform1i(glU.M, 2); gl.uniform1i(glU.B, 3);
}catch(e){ gl = null; }

function meshFill(p, Wt, Ht, R, c0){
  const lim = Math.PI/2 - 0.03, span = clamp(Wt/R, 0.05, Math.PI*1.9), thC = Math.asin(clamp(-c0/R, -0.94, 0.94)), cs0 = Math.cos(thC);
  const yB = Math.min(Ht*0.14, Math.max(2, R*0.07)), pe = Math.min(0.2, Math.max(0.03, Ht/Math.max(Wt, 1)*0.16)), k0 = 1/(1 - pe*(1 - cs0));
  const ca = Math.cos(p.a), sa = Math.sin(p.a); let n = 0;
  for(let j = 0; j <= ROWS; j++){ const v = j/ROWS;
    for(let i = 0; i <= COLS; i++){
      const th = clamp(thC + span*(i/COLS - 0.5), -lim, lim), cs = Math.cos(th);
      const x = c0 + R*Math.sin(th), y = (v - 0.5)*Ht*(1 - pe*(1 - cs))*k0 + (cs - cs0)*yB;
      mv[n++] = p.x + x*ca - y*sa; mv[n++] = p.y + x*sa + y*ca; mv[n++] = i/COLS; mv[n++] = v; mv[n++] = 0.2 + 0.8*Math.pow(cs, 0.4);
    }
  }
}
function drawTattoo(p){
  if(!gl) return drawTattoo2D(p);
  updateSkin(p);
  const useClip = skinReady && !noSkin;
  setStatus(skinReady && noSkin ? 'پوستی زیر طرح پیدا نشد؛ طرح بدون برش نشان داده می‌شود. عضو را زیر طرح ببر یا نور را بهتر کن.' : '');
  const s = (p.W * 1.6) / Math.max(ink.width, ink.height), Wt = ink.width*s, Ht = ink.height*s;
  let R, c0; const e = edgesAt(p, p.a);
  if(e){ R = (e.hl + e.hr)/2; c0 = (e.hr - e.hl)/2; } else { R = p.W * 0.55; c0 = 0; }
  if(R <= 4){ R = p.W * 0.55; c0 = 0; }
  if(glc.width !== cv.width || glc.height !== cv.height){ glc.width = cv.width; glc.height = cv.height; }
  gl.viewport(0, 0, glc.width, glc.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tV);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, cv);
  if(glInkVer !== inkVer){
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tI);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ink); gl.generateMipmap(gl.TEXTURE_2D);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false); glInkVer = inkVer;
  }
  if(mbDirty && mb.length){
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tM); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, mw, mh, 0, gl.RED, gl.UNSIGNED_BYTE, mb); mbDirty = false;
  }
  const bw = blackInk, alpha = bw ? clamp(opV * (1 + 0.45*clamp((0.55 - skinL)/0.35, 0, 1)), 0, 1) : opV;
  gl.uniform2f(glU.R, glc.width, glc.height); gl.uniform1f(glU.op, alpha); gl.uniform1f(glU.bw, bw ? 1 : 0); gl.uniform1f(glU.useM, useClip ? 1 : 0);
  meshFill(p, Wt, Ht, R, c0);
  gl.bufferData(gl.ARRAY_BUFFER, mv, gl.DYNAMIC_DRAW);
  gl.drawElements(gl.TRIANGLES, COLS*ROWS*6, gl.UNSIGNED_SHORT, 0);
  ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.drawImage(glc, 0, 0); ctx.restore();
}

// ---------- حلقه‌ی اصلی ----------
let lastVT = -1;
const WORK_MAX = 1100;   // بیشترین طول بوم پردازش (کمتر = روان‌تر)
function loop(){
  requestAnimationFrame(loop);
  if(!stream || video.readyState < 2 || !video.videoWidth) return;
  if(video.currentTime === lastVT) return;      // فریم جدیدی از دوربین نیامده؛ دوباره پردازش نکن
  lastVT = video.currentTime;
  const k0 = Math.min(1, WORK_MAX / Math.max(video.videoWidth, video.videoHeight));
  const cw = Math.round(video.videoWidth * k0), ch = Math.round(video.videoHeight * k0);
  if(cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
  if(tx == null || lastW !== cw || lastH !== ch){
    tx = cw/2; ty = ch/2; lastW = cw; lastH = ch; dtx = null; eL = null; eR = null;
  }
  // حرکت نرم به سمت مقدار هدف
  const nowT = performance.now();
  if(dtx == null){ dtx = tx; dty = ty; dsc = sc; drot = rot; euroReset(); lastT = nowT; }
  else {
    const dt = Math.min(0.1, Math.max(0.004, (nowT - lastT)/1000)); lastT = nowT;
    const u = 1000 / Math.min(cw, ch);                       // مستقل از رزولوشن
    dtx = euro(fX, tx*u, dt, 2.0, 0.015) / u;
    dty = euro(fY, ty*u, dt, 2.0, 0.015) / u;
    dsc = Math.exp(euro(fS, Math.log(sc), dt, 2.0, 2.5));
    drot = euro(fR, rot, dt, 2.0, 1.2);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(video, 0, 0, cw, ch);
  if(!ink) return;
  const p = {x: dtx, y: dty, W: Math.min(cw, ch) * 0.25 * dsc, a: drot};
  drawTattoo(p);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

$('moreBtn').onclick = () => { const o = $('sheet').classList.toggle('open'); $('moreBtn').classList.toggle('on', o); };

// ---------- ثبت عکس ----------
$('snapBtn').onclick = () => {
  toast('📸 عکس گرفته شد…');
  cv.toBlob(b => {
    if(!b){ toast('ساخت تصویر ناموفق بود؛ دوباره امتحان کن.'); return; }
    const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    let file = null; try{ file = new File([b], 'inkoo-ar.jpg', {type:'image/jpeg'}); }catch(_){}
    const dl = () => {
      const u = URL.createObjectURL(b), a = document.createElement('a');
      a.href = u; a.download = 'inkoo-ar.jpg'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 60000);
    };
    if(touch && file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'INKOO'}).catch(err => { if(!err || err.name !== 'AbortError') dl(); });
    } else dl();
  }, 'image/jpeg', 0.92);
};
